name: Build and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a publicar (ex: v1.2.3)'
        required: true
        type: string
      prerelease:
        description: 'Marcar como pré-lançamento'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────
  # Windows — x86 and x64
  # ──────────────────────────────────────────────────────────────
  build-windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            msbuild_platform: Win32
            bin_dir: x86
          - arch: x64
            msbuild_platform: x64
            bin_dir: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vcpkg libpq x86
        if: matrix.arch == 'x86'
        id: cache-libpq-x86
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed\x86-windows
          key: vcpkg-libpq-x86-windows-${{ hashFiles('C:/vcpkg/versions/baseline.json') }}

      - name: Install libpq x86 via vcpkg (first run ~15 min; cached ~30 s)
        if: matrix.arch == 'x86' && steps.cache-libpq-x86.outputs.cache-hit != 'true'
        shell: powershell
        run: C:\vcpkg\vcpkg.exe install libpq:x86-windows --recurse

      - name: Wire x86 libpq.lib from vcpkg
        if: matrix.arch == 'x86'
        shell: powershell
        run: |
          $src = "C:\vcpkg\installed\x86-windows\lib\libpq.lib"
          if (-not (Test-Path $src)) { Write-Error "libpq.lib not found at $src"; exit 1 }
          Copy-Item $src "libs\x86\libpq.lib" -Force
          Write-Host "Replaced libs\x86\libpq.lib with vcpkg x86-windows"

      - name: Assert libpq x86 version >= 15
        if: matrix.arch == 'x86'
        shell: powershell
        run: |
          $ver = (C:\vcpkg\vcpkg.exe list libpq:x86-windows) |
                 Select-String 'libpq:x86-windows\s+(\d+)\.' |
                 ForEach-Object { [int]$_.Matches[0].Groups[1].Value }
          Write-Host "libpq:x86-windows major version: $ver"
          if ($ver -lt 15) { Write-Error "libpq x86 version $ver < 15"; exit 1 }

      - name: Update vendor/libpq headers from EDB PG15 x64 zip (arch-neutral headers)
        if: matrix.arch == 'x86'
        shell: powershell
        run: |
          $url = "https://get.enterprisedb.com/postgresql/postgresql-15.18-1-windows-x64-binaries.zip"
          Invoke-WebRequest $url -OutFile pg15.zip -UseBasicParsing
          Expand-Archive pg15.zip -DestinationPath pg15_extracted
          $inc = "pg15_extracted\pgsql\include"
          foreach ($f in @("libpq-fe.h","libpq-events.h","postgres_ext.h","pg_config.h")) {
              if (Test-Path "$inc\$f") { Copy-Item "$inc\$f" "vendor\libpq\$f" -Force }
          }
          Write-Host "vendor/libpq headers updated from EDB PG15"

      - name: Fix libpq x64 (pre-installed PostgreSQL on runner — no download needed)
        if: matrix.arch == 'x64'
        shell: powershell
        run: |
          $pgBase = "C:\Program Files\PostgreSQL"
          $pgVer  = (Get-ChildItem $pgBase | Sort-Object Name -Descending | Select-Object -First 1).Name
          $src    = "$pgBase\$pgVer\lib\libpq.lib"
          Copy-Item $src "libs\x64\libpq.lib" -Force
          Write-Host "Replaced libs\x64\libpq.lib with PostgreSQL $pgVer import lib"

      - name: Assert pre-installed libpq x64 version >= 15
        if: matrix.arch == 'x64'
        shell: powershell
        run: |
          $pgBase = "C:\Program Files\PostgreSQL"
          $pgVer  = (Get-ChildItem $pgBase | Sort-Object Name -Descending | Select-Object -First 1).Name
          Write-Host "Detected PostgreSQL $pgVer on runner"
          if ([int]($pgVer -replace '\D','') -lt 15) {
            Write-Error "Runner PostgreSQL $pgVer < 15"; exit 1
          }
          Write-Host "Version OK: $pgVer >= 15"

      - name: Update Premake5 to beta2 (bundled exe is too old for vs2022)
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-windows.zip" -OutFile premake5.zip -UseBasicParsing
          Expand-Archive premake5.zip -DestinationPath premake5_dl
          Move-Item premake5_dl\premake5.exe utils\premake5.exe -Force

      - name: Generate project files (Premake5 → VS2022)
        shell: cmd
        run: utils\premake5.exe vs2022

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build ${{ matrix.arch }} Release
        shell: cmd
        run: >
          msbuild Build\ml_pgsql.sln
          /p:Configuration=Release
          /p:Platform=${{ matrix.msbuild_platform }}
          /m /nologo /verbosity:minimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ml_pgsql-windows-${{ matrix.arch }}
          path: Bin/${{ matrix.bin_dir }}/Release/ml_pgsql.dll
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────
  # Linux — x64
  # ──────────────────────────────────────────────────────────────
  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (libpq-dev PG15 via PGDG)
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null <<EOF
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: ${VERSION_CODENAME}-pgdg
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          sudo apt-get update -q
          sudo apt-get install -y postgresql-client-15 "libpq-dev=15.*" make
          pg_config --version
          pg_config --includedir

      - name: Download Premake5 (Linux)
        run: |
          wget -q https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz
          tar -xf premake-5.0.0-beta2-linux.tar.gz
          chmod +x premake5
          mv premake5 utils/premake5
          utils/premake5 --version

      - name: Generate makefiles
        run: utils/premake5 gmake2

      - name: Build Linux x64 Release
        run: |
          cd Build
          make config=release_x64 all 2>&1
          echo "--- build output tree ---"
          find ../Bin -type f 2>/dev/null || echo "(Bin dir not found)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ml_pgsql-linux-x64
          path: Bin/x64/Release/ml_pgsql.so
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────
  # Release — tag v* push  OR  manual workflow_dispatch
  # ──────────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Windows x86
        uses: actions/download-artifact@v4
        with:
          name: ml_pgsql-windows-x86
          path: artifacts/win-x86

      - name: Download Windows x64
        uses: actions/download-artifact@v4
        with:
          name: ml_pgsql-windows-x64
          path: artifacts/win-x64

      - name: Download Linux x64
        uses: actions/download-artifact@v4
        with:
          name: ml_pgsql-linux-x64
          path: artifacts/linux-x64

      - name: Rename artifacts for release
        run: |
          cp artifacts/win-x86/ml_pgsql.dll  ml_pgsql32.dll
          cp artifacts/win-x64/ml_pgsql.dll  ml_pgsql64.dll
          cp artifacts/linux-x64/ml_pgsql.so ml_pgsql64.so

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            ml_pgsql32.dll
            ml_pgsql64.dll
            ml_pgsql64.so
          generate_release_notes: true
          body: |
            ## Install

            Place the file matching your MTA:SA server architecture in `server/mods/deathmatch/modules/`
            and add to `mtaserver.conf`:

            ```xml
            <module src="ml_pgsql64.dll"/>
            ```

            | File | Platform |
            |------|----------|
            | `ml_pgsql32.dll` | Windows x86 |
            | `ml_pgsql64.dll` | Windows x64 |
            | `ml_pgsql64.so`  | Linux x64   |

            ## API

            ```lua
            local conn = pg_conn("postgresql://user:pass@host:5432/db")

            pg_query(conn, function(result)
                if result then
                    local rows = pg_poll(result)
                end
            end, "SELECT id, nome FROM players WHERE id = $1", playerId)

            pg_exec(conn, function(ok) end,
                "INSERT INTO players (nome) VALUES ($1)", playerName)

            pg_prepare(conn, "get_player", "SELECT * FROM players WHERE id = $1")
            pg_query_prepared(conn, "get_player", function(result)
                local rows = pg_poll(result)
            end, playerId)

            pg_close(conn)
            ```
